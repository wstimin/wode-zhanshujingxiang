<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime World - 欢迎来到可爱的动漫世界</title>
    <style>
        /* --- 样式部分保持不变 --- */
        body { margin: 0; font-family: 'Comic Sans MS', sans-serif; background: linear-gradient(135deg, #fff1eb 0%, #ace0f9 100%); color: #555; display: flex; flex-direction: column; min-height: 100vh; }
        .navbar { display: flex; justify-content: space-between; padding: 15px 5%; background: rgba(255,255,255,0.6); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 100; }
        .brand { font-size: 24px; color: #ff85a2; font-weight: bold; }
        .nav-links a { margin-left: 20px; color: #777; text-decoration: none; }
        .main-content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 50px 20px; }
        .avatar { width: 150px; height: 150px; border-radius: 50%; border: 5px solid #fff; box-shadow: 0 10px 20px rgba(255,133,162,0.3); }
        h1 { color: #ff85a2; margin-top: 20px; text-shadow: 1px 1px 2px white; }
        
        /* 核心卡片样式 */
        .magic-box {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 90%;
            margin-top: 30px;
            border: 2px solid #fff0f5;
        }
        .btn-copy {
            background: linear-gradient(to right, #ff85a2, #ffacc7);
            color: white;
            padding: 15px 40px;
            border-radius: 30px;
            font-size: 1.2em;
            font-weight: bold;
            border: none;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 5px 15px rgba(255, 133, 162, 0.4);
            transition: transform 0.2s;
        }
        .btn-copy:active { transform: scale(0.98); }
        textarea {
            width: 100%; height: 60px; margin-top: 15px; padding: 10px;
            border-radius: 10px; border: 1px dashed #ccc;
            font-size: 12px; color: #999; resize: none;
            background: #fafafa;
        }
        footer { text-align: center; padding: 20px; color: #aaa; font-size: 0.9em; }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="brand">🌸 Anime World</div>
        <div class="nav-links"><a href="#">首页</a><a href="#">画廊</a></div>
    </nav>

    <main class="main-content">
        <img src="https://api.dicebear.com/7.x/adventurer-neutral/svg?seed=Mochi&backgroundColor=ffd5dc" class="avatar">
        <h1>欢迎回家 <span style="color:#ffd700">✨</span></h1>
        <p>这里充满了治愈的能量，祝你今天也开心！</p>

        <div class="magic-box">
            <button class="btn-copy" onclick="copyMagicLink()">🚀 一键复制节点链接</button>
            <textarea id="linkOutput" readonly placeholder="点击上方按钮，链接会自动出现在这里并复制..."></textarea>
        </div>
    </main>

    <footer>© 2025 Anime World</footer>

    <script>
        // ==========================================
        // 👇 请在这里填入你的真实 UUID (保留引号)
        const MY_UUID = "8052daa7-567f-46b8-b7e9-280d8fe059fb"; 
        
        // 👇 这里不需要动，路径已经固定是 /a
        const MY_PATH = "/a"; 
        // ==========================================

        function copyMagicLink() {
            // 1. 自动获取当前域名
            const host = window.location.hostname;
            
            // 2. 对路径进行转义 (修复 V2Ray 识别错误的关键)
            // 把 /a 变成 %2Fa，这样软件绝不会识别错
            const safePath = encodeURIComponent(MY_PATH); 

            // 3. 生成完美的 VLESS 链接
            const link = `vless://${MY_UUID}@${host}:443?encryption=none&security=tls&type=ws&host=${host}&path=${safePath}#AnimeNode-${host}`;

            // 4. 显示并复制
            const textarea = document.getElementById('linkOutput');
            textarea.value = link;
            textarea.select();
            document.execCommand("copy");

            // 5. 按钮变色提示
            const btn = document.querySelector('.btn-copy');
            const originalText = btn.innerText;
            btn.innerText = "复制成功！去粘贴吧 ✅";
            btn.style.background = "linear-gradient(to right, #56ab2f, #a8e063)"; // 变绿色
            
            setTimeout(() => { 
                btn.innerText = originalText; 
                btn.style.background = ""; // 恢复粉色
            }, 3000);
        }
    </script>

</body>
</html>
